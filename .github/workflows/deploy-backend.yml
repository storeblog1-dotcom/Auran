name: Deploy FastAPI Backend to Google Cloud Run

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build, Migrate & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          cd backend
          gcloud run deploy instagram-backend \
            --source . \
            --region asia-northeast3 \
            --allow-unauthenticated \
            --set-env-vars "APP_NAME=Auran,APP_ENV=production,DATABASE_URL=${{ secrets.DATABASE_URL }},SECRET_KEY=${{ secrets.SECRET_KEY }},ALLOWED_ORIGINS=*,SUPABASE_URL=${{ secrets.SUPABASE_URL }},SUPABASE_STORAGE_BUCKET=uploads,SUPABASE_KEY=${{ secrets.SUPABASE_KEY }},SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANNON_KEY }},SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }},EXPO_ACCESS_TOKEN=${{ secrets.EXPO_ACCESS_TOKEN }},YOUTUBE_DATA_API_KEY=${{ secrets.YOUTUBE_DATA_API_KEY }},INTEGRATION_MASTER_KEY=${{ secrets.INTEGRATION_MASTER_KEY }},INSTALLATION_HMAC_SECRET=${{ secrets.INSTALLATION_HMAC_SECRET }}"
